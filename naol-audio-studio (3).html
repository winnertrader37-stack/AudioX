const KC=new Map();
function ksBuf(f){const key=f.toFixed(1);if(KC.has(key))return KC.get(key);const sr=AC.sampleRate,n=Math.floor(sr*3),b=AC.createBuffer(1,n,sr),d=b.getChannelData(0),N=Math.max(2,Math.round(sr/f-.5)),ln=new Float32Array(N);

 o1.type='triangle';o2.type='sine';o1.frequency.value=fr;o2.frequency.value=fr*2;g1.gain.value=.8;g2.gain.value=.12;lf.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.setTargetAtTime(live?10:3,t+.35,.3);lf.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);

// ---------- Sagalee → Meeshaa (pitch scan, AI/API malee) ----------
const vst=t=>q('viSt').textContent=t,HOP=V2I.HOP;
let SCN=null,vbusy=false,pv=null;
const kinds=()=>[...q('viK').querySelectorAll('input:checked')].map(i=>i.value);
q('viVo').oninput=e=>q('viVov').textContent=e.target.value;q('viIl').oninput=e=>q('viIlv').textContent=e.target.value;const IL=()=>+q('viIl').value;let noAuto=false;
function viDraw(){const c=q('viPr'),dp=devicePixelRatio||1,w=c.clientWidth||300,h=86;c.width=Math.round(w*dp);c.height=Math.round(h*dp);const g=c.getContext('2d');g.scale(dp,dp);g.fillStyle='#0c0c0e';g.fillRect(0,0,w,h);
 if(!SCN||!SCN.notes.length){g.fillStyle='#6a6a70';g.font='12px system-ui';g.textAlign='center';g.fillText('Scan godhi → pitch asitti agarsiifama',w/2,h/2+4);return}
 const{an,notes,ons}=SCN,T=an.n*HOP;let lo=1e9,hi=-1e9;notes.forEach(n=>{lo=Math.min(lo,n.midi);hi=Math.max(hi,n.midi)});lo=Math.floor(lo)-2;hi=Math.ceil(hi)+2;
 const y=m=>h-12-(m-lo)/(hi-lo)*(h-24),x=t=>t/T*w;
 g.strokeStyle='#222';g.lineWidth=1;g.fillStyle='#555';g.font='9px system-ui';g.textAlign='left';for(let m=lo;m<=hi;m++)if(m%12==0){g.beginPath();g.moveTo(0,y(m)+.5);g.lineTo(w,y(m)+.5);g.stroke();g.fillText('C'+(m/12-1),2,y(m)-2)}
 g.fillStyle='#19e0d4';notes.forEach(n=>{g.globalAlpha=.35+.65*n.vel;g.fillRect(x(n.i0*HOP),y(Math.round(n.midi))-4,Math.max(2,x((n.i1-n.i0)*HOP)),8)});g.globalAlpha=1;
 g.fillStyle='#fff';for(let i=0;i<an.n;i++){const m=an.midi[i];if(m===m)g.fillRect(x(i*HOP),y(m)-1,1.5,2)}
 g.fillStyle='#ff9f43';ons.forEach(o=>g.fillRect(x(o.t),h-8,2,8))}
async function viScan(){if(!buf){toast('Dura sagalee dabali (＋)');return false}if(vbusy)return false;vbusy=true;
 try{halt();const sr=buf.sampleRate,[a,b]=range(),s=Math.floor(a*sr),e=Math.floor(b*sr),n=e-s;
  if(n<sr*.3){vst('⚠ Sagaleen gabaabaa dha (≥0.3 s)');return false}
  if(n>sr*300){vst('⚠ Sagaleen dheeraa dha (>5 min). Dura filannoo gabaabsi.');return false}
  const x=new Float32Array(n),nc=buf.numberOfChannels;for(let c=0;c<nc;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)x[i]+=d[s+i]/nc}
  const an=await V2I.analyze(x,sr,p=>vst('Pitch scan… '+Math.round(p*100)+'%'));
  const notes=V2I.segment(an);vst('Rhythm scan…');await new Promise(r=>setTimeout(r));const ons=V2I.onsets(x,sr);
  SCN={buf,a:s,e,an,notes,ons,sr};viDraw();
  if(!notes.length){vst('⚠ Pitch hin argamne. Sagaleen ifaa/dhiphina qabu (noise xiqqaa) fayyadami; yoo music guddaa jiraate dura "Sagalee QOFA" tool fayyadami.');return false}
  const mids=notes.map(n=>n.midi),lo=Math.round(Math.min(...mids)),hi=Math.round(Math.max(...mids)),md=V2I.median(mids),vc=100*an.midi.reduce((q2,m)=>q2+(m===m?1:0),0)/an.n;
  vst('✔ Scan xumurameera · note '+notes.length+' · '+nn(lo)+' – '+nn(hi)+' (giddu '+nn(Math.round(md))+') · sagalee '+Math.round(vc)+'% · rhythm hit '+ons.length);return true}
 catch(err){vst('Dogoggora: '+err.message);return false}finally{vbusy=false}}
const allowed=()=>new Set(scArr().map(s=>(s+root)%12));
function snapScale(m){const pcs=allowed(),r=Math.round(m);let best=r,bd=99;for(let k=-7;k<=7;k++){const c=r+k;if(pcs.has(((c%12)+12)%12)){const d=Math.abs(c-m);if(d<bd){bd=d;best=c}}}return best}
async function viRender(){if(!SCN||SCN.buf!==buf){if(!await viScan())return null}
 const ks=kinds();if(!ks.length){vst('⚠ Meeshaa tokko filadhu');return null}
 bus();const{an,notes,ons,sr}=SCN,len=SCN.e-SCN.a,X=new OfflineAudioContext(2,len,sr),B=mkBus(X,X.destination),mode=q('viSn').value,oc=q('viOc').value,medM=V2I.median(notes.map(n=>n.midi));

  if(k=='kb')notes.forEach(n=>{const g=gn(.25+.75*n.vel);W(g,()=>{const rel=kbVoice(tim,hz(n.midi,'kb'),n.i0*HOP);rel(n.i1*HOP+.03)})});
  else if(k=='kr')notes.forEach(n=>{const g=gn(1);W(g,()=>pluckAt(hz(n.midi,'kr'),n.i0*HOP,.35+.65*n.vel,n.i1*HOP))});
  else if(k=='dr'){const map=q('viDr').value=='keb'?[8,9,10]:[0,1,3];ons.forEach(o=>{const g=gn(.35+.65*o.vel);W(g,()=>DR[map[o.cls]][1](o.t))})}

   if(mode=='exact'){const s=V2I.smooth(V2I.med3(an.midi),3);for(let i=0;i<an.n;i++)if(s[i]===s[i])o[i]=s[i]+T}
   else{notes.forEach(n=>{const m=qm(n.midi)+T;for(let i=n.i0;i<n.i1;i++)o[i]=m});const s=V2I.smooth(o,5);for(let i=0;i<an.n;i++)o[i]=s[i]}

function viMixBuf(r,vl,il){const o=buf,a=SCN.a,len=SCN.e-SCN.a,out=mk(o,len);let p=0;for(let c=0;c<2;c++){const d=r.getChannelData(c);for(let i=0;i<len;i++){const v=Math.abs(d[i]);if(v>p)p=v}}

async function viGo(kind){if(vbusy||gob)return;if(!buf)return toast('Dura sagalee dabali (＋)');
